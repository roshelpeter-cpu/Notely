<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Notely is a woodland workspace for notes, tasks, and connected ideas." />
    <title>Notely</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('notely-theme') || 'system';
          var theme = stored;
          if (stored === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
          }
          if (theme !== 'day' && theme !== 'night') theme = 'day';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-theme-setting', stored);
          var accent = localStorage.getItem('notely-accent') || 'forest';
          document.documentElement.setAttribute('data-accent', accent);
          if (localStorage.getItem('notely-motion') === 'reduce') {
            document.documentElement.setAttribute('data-motion', 'reduce');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
